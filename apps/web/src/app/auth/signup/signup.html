<div class="auth-page">
  <div class="auth-card">
    <div class="logo">
      <span class="logo-text">STRIKE</span>
      <span class="logo-sub">CRICKET</span>
    </div>
    
    <h1 class="title">Create Account</h1>
    <p class="subtitle">Join the elite cricket scoring community</p>

    <form (ngSubmit)="onSubmit()" #signupForm="ngForm" class="form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          [(ngModel)]="name" 
          required 
          placeholder="John Doe"
          class="input"
        >
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          placeholder="name@example.com"
          class="input"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          placeholder="Minimum 8 characters"
          class="input"
          minlength="8"
        >
      </div>

      @if (error()) {
        <div class="error-box">
          {{ error() }}
        </div>
      }

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading() || !signupForm.valid">
        {{ loading() ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <div class="divider">
      <span>OR</span>
    </div>

    <button (click)="loginWithGoogle()" class="btn btn-outline btn-block">
      <img src="https://www.google.com/favicon.ico" alt="Google" width="16" height="16">
      Sign up with Google
    </button>

    <p class="footer-text">
      Already have an account? <a routerLink="/auth/login">Sign In</a>
    </p>
  </div>
</div>
