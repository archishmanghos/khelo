worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ─── Upstream Services ────────────────────────────────────────────────────

    upstream match_service {
        server host.docker.internal:3001;
    }

    upstream scoring_service {
        server host.docker.internal:3002;
    }

    upstream stats_service {
        server host.docker.internal:3003;
    }

    upstream realtime_gateway {
        server host.docker.internal:3004;
    }

    upstream auth_service {
        server host.docker.internal:3005;
    }

    upstream web_frontend {
        server host.docker.internal:4200;
    }

    # ─── Logging ──────────────────────────────────────────────────────────────

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── General ──────────────────────────────────────────────────────────────

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 256;

    # ─── Rate Limiting ───────────────────────────────────────────────────────

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ─── Server ──────────────────────────────────────────────────────────────

    server {
        listen 80;
        server_name localhost;

        # Health check for the gateway itself
        location /gateway/health {
            return 200 '{"service":"api-gateway","status":"healthy"}';
            add_header Content-Type application/json;
        }

        # ── Match Service ────────────────────────────────────────────────────
        location /api/v1/matches {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://match_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/health/match {
            proxy_pass http://match_service/api/v1/health;
        }

        # ── Scoring Service ─────────────────────────────────────────────────
        location /api/v1/innings {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://scoring_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/health/scoring {
            proxy_pass http://scoring_service/api/v1/health;
        }

        # ── Stats Service ───────────────────────────────────────────────────
        location /api/v1/stats {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://stats_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/health/stats {
            proxy_pass http://stats_service/api/v1/health;
        }

        # ── Auth Service ─────────────────────────────────────────────────────
        location /api/v1/auth {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/health/auth {
            proxy_pass http://auth_service/api/v1/health;
        }

        # ── Realtime Gateway (WebSocket) ─────────────────────────────────────
        location /socket.io/ {
            proxy_pass http://realtime_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # ── Frontend (Angular Dev Server) ────────────────────────────────────
        location / {
            proxy_pass http://web_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Angular HMR WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── CORS Headers ────────────────────────────────────────────────────
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
