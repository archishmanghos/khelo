# Khelo — Development Infrastructure
# Usage: docker compose -f infrastructure/docker/docker-compose.dev.yml up -d

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: khelo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: khelo
      POSTGRES_USER: khelo
      POSTGRES_PASSWORD: khelo_dev
    ports:
      - "5432:5432"
    volumes:
      - khelo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khelo -d khelo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: khelo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - khelo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # ─── Nginx API Gateway ─────────────────────────────────────────────────────
  api-gateway:
    image: nginx:1.27-alpine
    container_name: khelo-api-gateway
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ../../apps/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  khelo_pgdata:
    driver: local
  khelo_redis:
    driver: local
